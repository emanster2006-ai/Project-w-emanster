name: CI — Tests and optional live evaluation

on:
  workflow_dispatch:
    inputs:
      run_live_evaluation:
        description: Run provider-backed evaluation (requires keys and may incur cost)
        type: boolean
        default: false
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  api-contract:
    name: Deterministic API contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests/integration tests/unit/test_input_guard.py -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ── Job 1: Lint + Format ───────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting deps
        run: pip install black==24.10.0 ruff==0.6.9

      - name: Run black
        run: black --check .

      - name: Run ruff
        run: ruff check .

  # ── Job 2: Unit + Integration Tests ────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-unit.txt
          python -m spacy download en_core_web_lg

      - name: Run unit + integration tests
        run: pytest tests/unit tests/integration -v --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  # ── Job 3: RAG Eval Gate ────────────────────────────────────────────────────
  eval:
    name: RAG Evaluation Gate
    runs-on: ubuntu-latest
    needs: test
    # Live judge calls require an explicit dispatch; ordinary PR checks need no keys.
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_evaluation

    services:
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    env:
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      DEEPEVAL_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAITHFULNESS_THRESHOLD: "0.75"
      CONTEXTUAL_PRECISION_THRESHOLD: "0.70"
      ANSWER_RELEVANCY_THRESHOLD: "0.75"
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_lg

      - name: Wait for Qdrant
        run: curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://localhost:6333/healthz

      - name: Load evidence and prepare evaluation questions
        run: |
          python scripts/ingest.py --sample-only
          python scripts/prepare_eval_dataset.py

      - name: Run DeepEval RAG quality gate
        run: deepeval test run tests/eval/test_rag_quality.py -v

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.sha }}
          path: eval_results.json

