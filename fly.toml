# Fly.io deploy config for SecureRAG API
# Deploy: fly deploy
# First time: fly launch --no-deploy, then fly deploy

app = "securerag-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  TOP_K_RETRIEVE = "20"
  TOP_K_RERANK = "5"
  ENABLE_HYBRID_RETRIEVAL = "true"
  ENABLE_HYDE = "true"
  ENABLE_QUERY_DECOMPOSITION = "true"
  RATE_LIMIT_PER_MINUTE = "20"
  MAX_QUERY_LENGTH = "2000"

# Secrets (set via: fly secrets set KEY=value)
# GROQ_API_KEY
# OPENAI_API_KEY
# QDRANT_URL          (Qdrant Cloud URL)
# QDRANT_API_KEY      (Qdrant Cloud API key)
# REDIS_URL           (Upstash Redis URL)
# LANGFUSE_PUBLIC_KEY
# LANGFUSE_SECRET_KEY

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
